plugins {
    id "base"
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}" apply false
}

def modProjects = [
        "mouse-boat-steering"  : [
                version: "1.3.0",
                group  : "dev.mouseboatsteering",
                archive: "mouse-boat-steering"
        ],
        "server-latency-display": [
                version: "1.0.0",
                group  : "dev.serverlatencydisplay",
                archive: "server-latency-display"
        ]
]

subprojects {
    def mod = modProjects[project.name]

    apply plugin: "net.fabricmc.fabric-loom-remap"
    apply plugin: "maven-publish"

    version = mod.version
    group = mod.group

    base {
        archivesName = mod.archive
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    }

    processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                from components.java
            }
        }
    }
}

tasks.named("build") {
    dependsOn subprojects.collect { "${it.path}:build" }
}

tasks.named("clean") {
    dependsOn subprojects.collect { "${it.path}:clean" }
}
